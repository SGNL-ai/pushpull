name: publish

on:
  push:
    branches: [ main ]
    paths-ignore: 
      - README.md
      - CHANGELOG.md
      - CODE_OF_CONDUCT.md
      - LICENSE
      - SECURITY.md
      - '.github/**'
      - Makefile
      - contributing.md
      - .gitignore
      - working-group-charter.md
      
  pull_request:
    branches: [ main ]
    paths-ignore: 
      - README.md
      - CHANGELOG.md
      - CODE_OF_CONDUCT.md
      - LICENSE
      - SECURITY.md
      - '.github/**'
      - Makefile
      - contributing.md
      - .gitignore
      - working-group-charter.md

jobs:
  build-pushpull:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Ruby
        uses: ruby/setup-ruby@89f90524b88a01fe6e0b732220432cc6142926af # v1 (v1.313.0)
        with:
          ruby-version: '3.1'
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6 (v6.2.0)
        with:
          python-version: '3.10' 
      - name: Install kramdown-rfc
        run: gem install kramdown-rfc
      - name: Install xml2rfc
        run: pip install xml2rfc
      - name: Convert pushpull md to xml
        run: kramdown-rfc2629 draft-tulshibagwale-saag-pushpull-delivery.md > draft-tulshibagwale-saag-pushpull-delivery.xml
      - name: Render HTML
        run: xml2rfc draft-tulshibagwale-saag-pushpull-delivery.xml --html -o index.html
      - name: Render Text
        run: xml2rfc draft-tulshibagwale-saag-pushpull-delivery.xml --text
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7 (v7.0.1)
        with:
          name: my-artifact
          path: |
            index.html
            draft-tulshibagwale-saag-pushpull-delivery.txt

  # Deployment job
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build-pushpull]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8 (v8.0.1)
        with:
          name: my-artifact
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4 (v4.0.0)
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5 (v5.0.0)
